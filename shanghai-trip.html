<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai Trip · 11–15 November</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #fdf8f0; --card: #ffffff; --ink: #2b2320; --muted: #8a7a70;
  --accent: #e04a2f; --border: #f0e4d8;
  --d1: #e0409a; --d2: #2f8f6b; --d3: #e07b2f; --d4: #5b7fb5; --d5: #9b59b6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 24px 16px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
header { text-align: center; margin-bottom: 20px; }
.badge {
  display: inline-block; background: var(--accent); color: #fff;
  font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
  padding: 6px 16px; border-radius: 999px; margin-bottom: 10px;
}
h1 { font-size: 48px; font-weight: 800; letter-spacing: 6px; color: var(--accent); line-height: 1.1; }
.subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 660px; margin-left: auto; margin-right: auto; }

.tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 22px 0 18px; align-items: center; }
.toggle-eat {
  border: 2px solid var(--border); background: var(--card); color: var(--muted);
  font-weight: 600; font-size: 11px; padding: 7px 14px;
  border-radius: 999px; cursor: pointer; transition: all .15s ease; font-family: inherit;
  margin-left: 12px;
}
.toggle-eat.active { background: #e07b2f; color: #fff; border-color: #e07b2f; }
.tab {
  border: 2px solid var(--border); background: var(--card); color: var(--muted);
  font-weight: 700; font-size: 13px; letter-spacing: 0.5px; padding: 9px 18px;
  border-radius: 999px; cursor: pointer; transition: all .15s ease; font-family: inherit;
}
.tab small { display: block; font-weight: 500; font-size: 10px; color: var(--muted); letter-spacing: 0; }
.tab.active { color: #fff; border-color: transparent; }
.tab.active[data-id="1"] { background: var(--d1); }
.tab.active[data-id="2"] { background: var(--d2); }
.tab.active[data-id="3"] { background: var(--d3); }
.tab.active[data-id="4"] { background: var(--d4); }
.tab.active[data-id="5"] { background: var(--d5); }
.tab.active small { color: rgba(255,255,255,0.85); }
.tab:hover:not(.active) { background: #f5efe6; }

.main { display: flex; flex-direction: column; gap: 14px; }

.timeline { display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.stop {
  background: var(--card); border: 2px solid var(--border); border-radius: 12px;
  padding: 10px 12px; cursor: pointer; transition: all .15s ease;
}
.stop:hover { border-color: #d4c8b8; }
.stop .row1 { display: flex; align-items: center; gap: 8px; }
.stop .num {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
  background: #6b7280; color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.stop .time { font-size: 12px; font-weight: 700; color: #7a4a50; white-space: nowrap; }
.stop .obj {
  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
  padding: 3px 8px; border-radius: 999px; color: #fff; white-space: nowrap;
}
.obj.Eat { background: #e07b2f; }
.obj.Shopping { background: #9b59b6; }
.obj.Sightseeing { background: #2f8f6b; }
.obj.Travel { background: #7a8a99; }
.stop .name { font-size: 13.5px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
.stop .zone {
  display: inline-block; margin-top: 5px; font-size: 10.5px; font-weight: 600;
  color: var(--muted); background: #f8f5f0; border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 999px;
}
.stop .note { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.35; font-style: italic; }
.stop .detail { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
.stop .detail .dhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stop .detail .dhead .dname { font-size: 13px; font-weight: 700; }
.stop .detail .dhead .dtime { font-size: 12px; font-weight: 700; color: #7a4a50; }
.stop .detail .mustgo { background: #e07b2f; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 2px 8px; border-radius: 999px; }
.stop .detail .dzone { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 600; color: var(--muted); background: #f8f5f0; border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; }
.stop .detail .dnote { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.backups-btn { margin-top: 9px; border: 1.5px solid #e07b2f; background: #fff; color: #e07b2f; font-weight: 700; font-size: 11.5px; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .15s; }
.backups-btn:hover { background: #e07b2f; color: #fff; }
.backups-list { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
.backups-list .bitem { display: flex; align-items: baseline; gap: 8px; background: #fbf6ee; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; }
.backups-list .bitem .bname { font-weight: 700; }
.backups-list .bitem .bday { color: var(--muted); font-size: 11px; white-space: nowrap; }
.backups-list .bitem .bdist { margin-left: auto; color: #2f8f6b; font-weight: 700; font-size: 11px; white-space: nowrap; }
.backups-list .bitem .bbranch { color: #e07b2f; font-weight: 700; font-size: 10.5px; white-space: nowrap; }
.backups-note { margin-top: 6px; font-size: 10.5px; color: var(--muted); font-style: italic; }
.maplegend .bbranch { width: 12px; height: 12px; border: 2px dashed #e07b2f; border-radius: 50%; background: #fff; display: inline-block; }
.schem-popup { position: absolute; z-index: 20; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 10px 12px; width: 250px; font-size: 12px; }
.schem-popup .sp-head { display: flex; align-items: flex-start; gap: 6px; }
.schem-popup .sp-name { font-weight: 700; font-size: 13px; line-height: 1.3; }
.schem-popup .sp-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.schem-popup .sp-close { margin-left: auto; border: none; background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; line-height: 1; padding: 0 2px; }
.schem-popup .backups-btn { margin-top: 8px; }
.leaflet-popup-content .backups-btn { margin-top: 8px; }
.leaflet-popup-content .backups-list { margin-top: 8px; }
.leaflet-popup-content .backups-list .bitem { font-size: 11.5px; padding: 5px 8px; }

.mapbox {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column;
}
.mapwrap { flex: 1; min-height: 560px; background: #f6f1e7; position: relative; }
.mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#map { cursor: grab; }
#realMap { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
.map-toolbar { display: flex; justify-content: flex-start; margin-bottom: 8px; }
.map-view-toggle {
  display: flex; gap: 4px; background: var(--card); border-radius: 6px;
  border: 1px solid var(--border); padding: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
.map-view-btn {
  border: none; background: transparent; color: var(--muted); font-size: 11px;
  font-weight: 600; padding: 5px 10px; border-radius: 4px; cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.map-view-btn.active { background: var(--ink); color: #fff; }
.zoom-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
.zoom-btn {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--ink); font-size: 18px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; box-shadow: 0 1px 4px rgba(0,0,0,.1);
}
.zoom-btn:hover { background: #f5efe6; }
.maplegend {
  display: flex; gap: 12px; flex-wrap: wrap; padding: 9px 14px;
  border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); align-items: center;
}
.maplegend .lg { display: flex; align-items: center; gap: 5px; }
.maplegend .dot { width: 10px; height: 10px; border-radius: 3px; }
.maplegend .hotel { width: 12px; height: 12px; background: #3a3a3a; border-radius: 3px; }

.summary {
  background: #fff3c4; color: #6b5416;
  border-radius: 12px; padding: 12px 18px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.summary .slabel {
  background: #6b5416; color: #fff3c4; font-size: 11px; font-weight: 700;
  letter-spacing: 0.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.summary .arrow { color: var(--accent); font-weight: 800; }

/* plan tabs (main / relaxed) */
.plan-tabs { display: flex; gap: 8px; justify-content: center; margin: 0 0 10px; }
.plan-tab {
  border: 2px solid var(--border); background: var(--card); color: var(--muted);
  font-weight: 700; font-size: 12px; letter-spacing: 0.5px; padding: 8px 20px;
  border-radius: 999px; cursor: pointer; transition: all .15s ease; font-family: inherit;
}
.plan-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.plan-tab:hover:not(.active) { background: #f5efe6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge" id="tripBadge"></div>
    <h1 id="tripTitle"></h1>
    <div class="subtitle" id="tripSub"></div>
  </header>

  <div class="plan-tabs" id="planTabs"></div>
  <div class="tabs" id="tabs"></div>
  <div style="text-align:center;margin-bottom:14px">
    <button class="toggle-eat" id="toggleEat">Hide restaurants</button>
  </div>

  <div class="main">
    <div class="map-toolbar">
      <div class="map-view-toggle">
        <button class="map-view-btn active" id="viewSchematic">Schematic</button>
        <button class="map-view-btn" id="viewReal">Real Map</button>
      </div>
    </div>
    <div class="mapbox">
      <div class="mapwrap">
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomIn">+</button>
          <button class="zoom-btn" id="zoomOut">−</button>
          <button class="zoom-btn" id="zoomReset" style="font-size:12px">1:1</button>
        </div>
        <svg id="map" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="realMap"></div>
        <div class="schem-popup" id="schemPopup" style="display:none"></div>
      </div>
      <div class="maplegend">
        <span class="lg"><span class="dot" style="background:var(--d1)"></span> Day 1</span>
        <span class="lg"><span class="dot" style="background:var(--d2)"></span> Day 2</span>
        <span class="lg"><span class="dot" style="background:var(--d3)"></span> Day 3</span>
        <span class="lg"><span class="dot" style="background:var(--d4)"></span> Day 4</span>
        <span class="lg"><span class="dot" style="background:var(--d5)"></span> Day 5</span>
        <span class="lg"><span class="bbranch"></span> Backup branch</span>
        <span class="lg"><span class="hotel"></span> Hotel</span>
      </div>
    </div>
    <div class="summary" id="summary"></div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<script>
const DATA = {"trip": {"title": "SHANGHAI", "badge": "5 days · 4 nights · 11–15 November", "subtitle": "Family of 4 · Base: BAIhome Hotel, 355 Fuzhou Rd (People's Square) · Getting around by Didi", "hotel": {"name": "BAIhome Hotel (People's Square Fuzhou Rd)", "lat": 31.234, "lng": 121.4748}}, "plans": {"main": {"label": "Main plan", "days": [{"id": 1, "label": "DAY 1", "date": "Nov 11 (Wed)", "theme": "Arrival · The Bund at night", "stops": [{"time": "16:45", "zone": "Hotel (Fuzhou Rd)", "name": "Arrive hotel, drop luggage", "objective": "Travel", "note": "BAIhome Hotel, 355 Fuzhou Rd", "lat": 31.234, "lng": 121.4748, "short": "Hotel (drop bags)"}, {"time": "17:00–17:45", "zone": "Guangdong Rd (People's Square area)", "name": "Huxilao Longtang Noodle House (Guangdong Road Branch)", "objective": "Eat", "note": "World Trade Tower, 500 Guangdong Rd (1F) — classic Shanghai noodles; clam pork liver noodles is the signature. ~600 m walk from hotel / East Nanjing Rd metro", "lat": 31.23272, "lng": 121.481988, "short": "Huxilao noodles"}, {"time": "18:00–19:30", "zone": "The Bund", "name": "The Bund promenade (Puxi side)", "objective": "Sightseeing", "note": "Stroll the waterfront, view Lujiazui skyline lit up from across the river; ⚡ swap with Day 2 North Bund — decide on the day", "lat": 31.245, "lng": 121.491, "short": "The Bund"}]}, {"id": 2, "label": "DAY 2", "date": "Nov 12 (Thu)", "theme": "West Nanjing → People's Sq → East Nanjing → 818 Plaza → North Bund", "stops": [{"time": "10:00–10:45", "zone": "West Nanjing", "name": "Amam Bakery (Kerry Centre)", "objective": "Eat", "note": "Pastries + coffee, opens 10:00", "lat": 31.2285, "lng": 121.447, "short": "Amam Bakery"}, {"time": "10:45–12:00", "zone": "West Nanjing", "name": "West Nanjing Rd pedestrian street", "objective": "Shopping", "note": "Quietest part of the day for shopping", "lat": 31.2345, "lng": 121.465, "short": "West Nanjing Rd"}, {"time": "12:00–13:00", "zone": "West Nanjing", "name": "Xie San Bao (74 Nanhui Rd)", "objective": "Eat", "note": "Lunch — crab dishes, Nov is peak crab season", "lat": 31.2368, "lng": 121.4595, "short": "Xie San Bao"}, {"time": "13:30–15:00", "zone": "People's Square", "name": "People's Square (+ Shanghai Museum)", "objective": "Sightseeing", "note": "Bonus landmark, right between the two streets", "lat": 31.2296, "lng": 121.472, "short": "People's Square"}, {"time": "15:00–16:00", "zone": "People's Square", "name": "Shanghai IFC (shopping)", "objective": "Shopping", "note": "Mall next to People's Square — fashion, cosmetics, accessories; 3-min walk", "lat": 31.232, "lng": 121.47, "short": "Shanghai IFC"}, {"time": "16:15–17:30", "zone": "East Nanjing", "name": "East Nanjing Rd pedestrian street", "objective": "Shopping", "note": "Shops open till 22:00, livelier in the evening", "lat": 31.2355, "lng": 121.483, "short": "East Nanjing Rd"}, {"time": "18:00–19:00", "zone": "Jing'an (818 Plaza)", "name": "Long Time Ago (818 Plaza B1)", "objective": "Eat", "note": "Dinner — Xinjiang lamb skewers, night-market vibe. 818 Plaza B1, 818 W. Nanjing Rd (Jing'an) — shorter queue than the E. Nanjing Rd branch; ~¥97/person, 4.8★; open 11:00–14:00 & 16:30–00:00; Didi from E. Nanjing Rd ~5 min", "lat": 31.23102, "lng": 121.460984, "short": "Long Time Ago"}, {"time": "19:15–20:00", "zone": "North Bund", "name": "North Bund + Waibaidu Bridge", "objective": "Sightseeing", "note": "1933 Old Millfun area, walk the bridge — both skylines lit; ⚡ swap with Day 1 The Bund — decide on the day", "lat": 31.2455, "lng": 121.4925, "short": "North Bund + Bridge"}]}, {"id": 3, "label": "DAY 3", "date": "Nov 13 (Fri)", "theme": "Jing'an → Anfu → Wukang → Huaihai", "stops": [{"time": "09:00–10:45", "zone": "Jing'an Temple", "name": "Jing'an Temple + Park", "objective": "Sightseeing", "note": "Temple + adjacent park in one relaxed block; go early before it fills", "lat": 31.2235, "lng": 121.445, "short": "Jing'an Temple + Park"}, {"time": "11:00–12:00", "zone": "West Nanj /* ---------- all-days layer (background, dim) ---------- */
let allDaysLayer, selectedLayer, backupLayer;
function initLayers() {
  allDaysLayer = el('g', { id:'allDays' }, svg);
  selectedLayer = el('g', { id:'selected' }, svg);
  backupLayer = el('g', { id:'backups' }, svg);
}

function getStops(day) {
  return day.stops.filter(s => !s.offmap && (!hideEat || s.objective !== 'Eat')).map((s, i) => {
    const [px, py] = project(s.lat, s.lng);
    return Object.assign({}, s, { i, px, py });
  });
}

function drawAllDays() {
  allDaysLayer.innerHTML = '';
  days().forEach((day, di) => {
    const color = DAY_COLORS[di];
    const stops = getStops(day);
    for (let i = 0; i < stops.length - 1; i++) {
      el('line', {
        x1:stops[i].px, y1:stops[i].py, x2:stops[i+1].px, y2:stops[i+1].py,
        stroke:color, 'stroke-width':2, 'stroke-dasharray':'6 5', opacity:0.35
      }, allDaysLayer);
    }
    stops.forEach(s => {
      el('rect', {
        x:s.px-8, y:s.py-8, width:16, height:16, rx:4,
        fill:color, stroke:'#fff','stroke-width':1.5, opacity:0.5
      }, allDaysLayer);
    });
  });
}

/* ---------- selected day layer (prominent) ---------- */
function drawSelected(day) {
  selectedLayer.innerHTML = '';
  const color = DAY_COLORS[day.id - 1];
  const stops = getStops(day);
  for (let i = 0; i < stops.length - 1; i++) {
    el('line', {
      x1:stops[i].px, y1:stops[i].py, x2:stops[i+1].px, y2:stops[i+1].py,
      stroke:color, 'stroke-width':3.5, 'stroke-dasharray':'9 7', opacity:0.9
    }, selectedLayer);
    const mx = (stops[i].px+stops[i+1].px)/2, my = (stops[i].py+stops[i+1].py)/2;
    const ang = Math.atan2(stops[i+1].py-stops[i].py, stops[i+1].px-stops[i].px)*180/Math.PI;
    el('path', { d:'M -6 -6 L 8 0 L -6 6 Z', fill:color, transform:'translate('+mx+' '+my+') rotate('+ang+')' }, selectedLayer);
  }
  const [hpx, hpy] = project(DATA.trip.hotel.lat, DATA.trip.hotel.lng);
  const placed = hotelLabelBox ? [hotelLabelBox, { x: hpx - 11, y: hpy - 11, w: 22, h: 22 }] : [];
  stops.forEach((s, i) => {
    const stopRect = el('rect', { x:s.px-11, y:s.py-11, width:22, height:22, rx:5, fill:color, stroke:'#fff','stroke-width':2, style:'cursor:pointer' }, selectedLayer);
    stopRect.addEventListener('click', function(e) {
      e.stopPropagation();
      openSchematicPopup(s, s.px, s.py);
      const card = document.querySelector('.stop[data-i="'+i+'"]');
      if (card) {
        const det = card.querySelector('.detail');
        if (det) det.style.display = 'block';
        card.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    });
    const n = el('text', { x:s.px, y:s.py+4, fill:'#fff','font-size':11.5,'font-weight':700,'text-anchor':'middle' }, selectedLayer);
    n.textContent = i+1;
    const w = s.short.length * 6.1 + 16, h = 21;
    const cands = [
      [s.px+20, s.py-h/2],[s.px-20-w, s.py-h/2],[s.px-w/2, s.py-40],[s.px-w/2, s.py+22],
      [s.px+20, s.py-h/2+10],[s.px-20-w, s.py-h/2-10],[s.px-w/2, s.py-62],[s.px-w/2, s.py+44]
    ];
    let box = { x:cands[0][0], y:cands[0][1], w, h };
    for (const c of cands) {
      const b = { x:c[0], y:c[1], w, h };
      if (b.x < 4 || b.x+b.w > W-4 || b.y < 4 || b.y+b.h > H-4) continue;
      if (placed.every(p => !(b.x < p.x+p.w+4 && b.x+b.w+4 > p.x && b.y < p.y+p.h+3 && b.y+b.h+3 > p.y))) { box = b; break; }
    }
    placed.push(box);
    el('rect', { x:box.x, y:box.y, width:box.w, height:box.h, rx:5, fill:'#ffdf5e', stroke:'#e8c93e','stroke-width':1 }, selectedLayer);
    const t = el('text', { x:box.x+box.w/2, y:box.y+box.h/2+3.5, fill:'#222','font-size':11,'font-weight':600,'text-anchor':'middle' }, selectedLayer);
    t.textContent = s.short;
  });
}

/* ---------- backup branches (schematic) ---------- */
function drawBackupBranches() {
  backupLayer.innerHTML = '';
  if (hideEat) return;
  BACKUP_BRANCHES.forEach(b => {
    const [x, y] = project(b.lat, b.lng);
    const g = el('g', { 'data-branch': b.name, style: 'cursor:pointer' }, backupLayer);
    el('circle', { cx:x, cy:y, r:10, fill:'#fff', stroke:'#e07b2f', 'stroke-width':2, 'stroke-dasharray':'4 3' }, g);
    const t = el('text', { x:x, y:y+3.5, fill:'#e07b2f', 'font-size':10, 'font-weight':700, 'text-anchor':'middle' }, g);
    t.textContent = 'B';
    const lblY = (b.label === 'below') ? y + 22 : y - 14;
    const lbl = el('text', { x:x, y:lblY, fill:'#e07b2f', 'font-size':9.5, 'font-weight':700, 'text-anchor':'middle' }, g);
    lbl.textContent = b.short;
    g.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      openSchematicPopup(b, x, y);
    });
  });
}

/* ---------- schematic popup ---------- */
let schemPopup = null;
function closeSchematicPopup() {
  if (schemPopup) { schemPopup.style.display = 'none'; schemPopup = null; }
}
function openSchematicPopup(stop, px, py) {
  const wrap = document.querySelector('.mapwrap');
  if (!schemPopup) schemPopup = document.getElementById('schemPopup');
  const bkName = stop.main || stop.name;
  const bk = backupsFor(bkName);
  let h = '<div class="sp-head"><div><div class="sp-name">'+stop.name+'</div>'
        + '<div class="sp-meta">'+(stop.main ? ('Backup branch \u2014 backs up: '+stop.main) : ((stop.time||'')+(stop.zone?' \u00b7 '+stop.zone:'')))+'</div></div>'
        + '<button class="sp-close" id="spClose">\u00d7</button></div>';
  if (bk) h += '<button class="backups-btn" id="spBackups">Backups ('+bk.length+')</button><div id="spList" style="display:none">'+backupListHTML(bkName)+'</div>';
  schemPopup.innerHTML = h;
  schemPopup.style.display = 'block';
  const r = (stop.px !== undefined) ? [stop.px, stop.py] : [px, py];
  const rect = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const sx = rect.left - wr.left + (r[0] - vb.x) / vb.w * rect.width;
  const sy = rect.top - wr.top + (r[1] - vb.y) / vb.h * rect.height;
  let left = sx + 16, top = sy - 10;
  if (left + 260 > wr.width) left = sx - 266;
  if (left < 6) left = 6;
  if (top + 140 > wr.height) top = wr.height - 150;
  if (top < 6) top = 6;
  schemPopup.style.left = left + 'px';
  schemPopup.style.top = top + 'px';
  document.getElementById('spClose').addEventListener('click', closeSchematicPopup);
  const bb = document.getElementById('spBackups');
  if (bb) bb.addEventListener('click', function() {
    const l = document.getElementById('spList');
    l.style.display = (l.style.display === 'none') ? 'block' : 'none';
  });
}
svg.addEventListener('click', function() { closeSchematicPopup(); });

/* ---------- timeline ---------- */
function renderTimeline(day) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const stops = hideEat ? day.stops.filter(s => s.objective !== 'Eat') : day.stops;
  stops.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'stop';
    d.dataset.i = i;
    d.innerHTML =
      '<div class="row1">' +
        '<span class="num">'+(i+1)+'</span>' +
        '<span class="time">'+s.time+'</span>' +
        '<span class="obj '+s.objective+'">'+s.objective+'</span>' +
      '</div>' +
      '<div class="name">'+s.name+'</div>' +
      '<span class="zone">📍 '+s.zone+'</span>' +
      (s.note ? '<div class="note">'+s.note+'</div>' : '');
    if (s.objective === 'Eat') {
      const det = document.createElement('div');
      det.className = 'detail';
      det.style.display = 'none';
      det.innerHTML =
        '<div class="dhead"><span class="dname">'+s.name+'</span><span class="dtime">'+s.time+'</span><span class="mustgo">MUST-GO</span></div>' +
        '<span class="dzone">'+s.zone+'</span>' +
        (s.note ? '<div class="dnote">'+s.note+'</div>' : '') +
        (backupsFor(s.name) ? '<button class="backups-btn">Backups ('+backupsFor(s.name).length+')</button><div class="backups-list" style="display:none">'+backupListHTML(s.name)+'</div>' : '');
      d.appendChild(det);
    }
    tl.appendChild(d);
  });
}

/* ---------- timeline click (delegated, bound once) ---------- */
document.getElementById('timeline').addEventListener('click', function(e) {
  const card = e.target.closest('.stop');
  if (!card) return;
  const det = card.querySelector('.detail');
  if (!det) return;
  if (e.target.closest('.backups-btn')) {
    const list = det.querySelector('.backups-list');
    if (list) list.style.display = (list.style.display === 'none') ? 'block' : 'none';
    return;
  }
  det.style.display = (det.style.display === 'none') ? 'block' : 'none';
});

/* ---------- tabs ---------- */
/* ---------- plan tabs (main / relaxed) ---------- */
function buildPlanTabs() {
  const ptabs = document.getElementById('planTabs');
  ptabs.innerHTML = '';
  Object.keys(DATA.plans).forEach(key => {
    const b = document.createElement('button');
    b.className = 'plan-tab' + (key === currentPlan ? ' active' : '');
    b.dataset.plan = key;
    b.textContent = DATA.plans[key].label;
    b.addEventListener('click', () => selectPlan(key));
    ptabs.appendChild(b);
  });
}
function selectPlan(key) {
  currentPlan = key;
  document.querySelectorAll('.plan-tab').forEach(t => t.classList.toggle('active', t.dataset.plan === key));
  const activeDay = +document.querySelector('.tab.active').dataset.id;
  const day = days().find(d => d.id === activeDay);
  drawAllDays();
  drawSelected(day);
  renderTimeline(day);
  drawBackupBranches();
  if (realMap && document.getElementById('realMap').style.display !== 'none') drawRealMap(day);
  const parts = (hideEat ? day.stops.filter(s => s.objective !== 'Eat') : day.stops).map(s => s.short);
  document.getElementById('summary').innerHTML =
    '<span class="slabel">' + day.label + ' ROUTE</span> ' +
    parts.join(' <span class="arrow">\u2192</span> ');
}

function buildTabs() {
  const tabs = document.getElementById('tabs');
  days().forEach(d => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.id = d.id;
    b.innerHTML = d.label + '<small>' + d.date + '</small>';
    b.addEventListener('click', () => selectDay(d.id));
    tabs.appendChild(b);
  });
}

function selectDay(id) {
  const day = days().find(d => d.id === id);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.id === id));
  drawSelected(day);
  renderTimeline(day);
  drawBackupBranches();
  if (realMap && document.getElementById('realMap').style.display !== 'none') drawRealMap(day);
  const parts = (hideEat ? day.stops.filter(s => s.objective !== 'Eat') : day.stops).map(s => s.short);
  document.getElementById('summary').innerHTML =
    '<span class="slabel">'+day.label+' ROUTE</span> ' +
    parts.join(' <span class="arrow">→</span> ');
}

/* ---------- real map (Leaflet) ---------- */
let realMap = null, realMarkers = [], realRoute = null;
function initRealMap() {
  const center = [DATA.trip.hotel.lat, DATA.trip.hotel.lng];
  realMap = L.map('realMap', { zoomControl: false }).setView(center, 14);
  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=en', {
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '© Google', maxZoom: 18
  }).addTo(realMap);
  L.control.zoom({ position: 'bottomright' }).addTo(realMap);
  // hotel marker
  L.marker(center, { icon: L.divIcon({ html: '<div style="background:#3a3a3a;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #fff">H</div>', className: '' }) })
    .addTo(realMap).bindPopup('<b>BAIhome Hotel</b><br>355 Fuzhou Rd');
}
function drawRealMap(day) {
  if (!realMap) return;
  realMarkers.forEach(m => realMap.removeLayer(m));
  realMarkers = [];
  if (realRoute) realMap.removeLayer(realRoute);
  const stops = day.stops.filter(s => !s.offmap && (!hideEat || s.objective !== 'Eat'));
  const color = DAY_COLORS[day.id - 1];
  const pts = stops.map(s => [s.lat, s.lng]);
  if (pts.length > 1) {
    realRoute = L.polyline(pts, { color: color, weight: 3, dashArray: '8 6', opacity: 0.8 }).addTo(realMap);
  }
  stops.forEach((s, i) => {
    const icon = L.divIcon({
      html: '<div style="background:'+color+';color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+(i+1)+'</div>',
      className: ''
    });
    const m = L.marker([s.lat, s.lng], { icon: icon }).addTo(realMap);
    const bk = backupsFor(s.name);
    let ph = '<b>'+(i+1)+'. '+s.name+'</b><br><i>'+s.time+'</i><br>'+s.zone;
    if (bk) ph += '<br><button class="backups-btn" id="rpBackups">Backups ('+bk.length+')</button><div id="rpList" style="display:none">'+backupListHTML(s.name)+'</div>';
    m.bindPopup(ph);
    m.on('popupopen', function(e) {
      const bb = e.popup.getElement().querySelector('#rpBackups');
      if (bb) bb.addEventListener('click', function() {
        const l = e.popup.getElement().querySelector('#rpList');
        l.style.display = (l.style.display === 'none') ? 'block' : 'none';
      });
    });
    realMarkers.push(m);
  });
  BACKUP_BRANCHES.forEach(b => {
    const icon = L.divIcon({
      html: '<div style="width:24px;height:24px;border-radius:50%;background:#fff;border:2.5px dashed #e07b2f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#e07b2f;box-shadow:0 1px 4px rgba(0,0,0,.3)">B</div>',
      className: ''
    });
    const m = L.marker([b.lat, b.lng], { icon: icon }).addTo(realMap);
    const bk = backupsFor(b.main);
    let ph = '<b>'+b.name+'</b><br><i>Backup branch \u2014 same food, different queue</i><br>Backs up: '+b.main;
    if (bk) ph += '<br><button class="backups-btn" id="bpBackups">Backups ('+bk.length+')</button><div id="bpList" style="display:none">'+backupListHTML(b.main)+'</div>';
    m.bindPopup(ph);
    m.on('popupopen', function(e) {
      const bb = e.popup.getElement().querySelector('#bpBackups');
      if (bb) bb.addEventListener('click', function() {
        const l = e.popup.getElement().querySelector('#bpList');
        l.style.display = (l.style.display === 'none') ? 'block' : 'none';
      });
    });
    realMarkers.push(m);
  });
  if (pts.length > 0) realMap.fitBounds(pts, { padding: [40, 40] });
}
function switchMapView(mode) {
  const svgEl = document.getElementById('map');
  const realEl = document.getElementById('realMap');
  const zoomCtrl = document.querySelector('.zoom-controls');
  if (mode === 'real') {
    svgEl.style.display = 'none';
    realEl.style.display = 'block';
    zoomCtrl.style.display = 'none';
    document.getElementById('viewSchematic').classList.remove('active');
    document.getElementById('viewReal').classList.add('active');
    if (!realMap) initRealMap();
    realMap.invalidateSize();
    const day = days().find(d => +document.querySelector('.tab.active').dataset.id === d.id);
    drawRealMap(day);
  } else {
    realEl.style.display = 'none';
    svgEl.style.display = 'block';
    zoomCtrl.style.display = 'flex';
    document.getElementById('viewReal').classList.remove('active');
    document.getElementById('viewSchematic').classList.add('active');
  }
}
document.getElementById('viewSchematic').addEventListener('click', () => switchMapView('schematic'));
document.getElementById('viewReal').addEventListener('click', () => switchMapView('real'));

/* ---------- zoom ---------- */
const DEFAULT_VB = { x: W * 0.15, y: H * 0.15, w: W * 0.7, h: H * 0.7 }; // default = one zoom-in step
let vb = { x: DEFAULT_VB.x, y: DEFAULT_VB.y, w: DEFAULT_VB.w, h: DEFAULT_VB.h };
function setViewBox() {
  svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
}
setViewBox(); // apply default (one zoom-in step) on load
function zoomIn() {
  const nw = vb.w * 0.7, nh = vb.h * 0.7;
  vb.x += (vb.w - nw) / 2; vb.y += (vb.h - nh) / 2;
  vb.w = nw; vb.h = nh;
  setViewBox();
}
function zoomOut() {
  const nw = Math.min(W, vb.w / 0.7), nh = Math.min(H, vb.h / 0.7);
  vb.x -= (nw - vb.w) / 2; vb.y -= (nh - vb.h) / 2;
  vb.w = nw; vb.h = nh;
  setViewBox();
}
function zoomReset() { vb = { x: DEFAULT_VB.x, y: DEFAULT_VB.y, w: DEFAULT_VB.w, h: DEFAULT_VB.h }; setViewBox(); }
document.getElementById('zoomIn').addEventListener('click', zoomIn);
document.getElementById('zoomOut').addEventListener('click', zoomOut);
document.getElementById('zoomReset').addEventListener('click', zoomReset);
svg.addEventListener('wheel', function(e) {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

/* ---------- pan (drag to move) ---------- */
let panning = false, panStart = null;
function panScale() { // viewBox units per screen px (accounting for "meet" letterboxing)
  return Math.max(vb.w / svg.clientWidth, vb.h / svg.clientHeight);
}
svg.addEventListener('mousedown', function(e) {
  panning = true;
  panStart = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y };
  svg.style.cursor = 'grabbing';
  e.preventDefault();
});
window.addEventListener('mousemove', function(e) {
  if (!panning) return;
  const s = panScale();
  vb.x = panStart.vx - (e.clientX - panStart.x) * s;
  vb.y = panStart.vy - (e.clientY - panStart.y) * s;
  setViewBox();
});
window.addEventListener('mouseup', function() {
  panning = false;
  svg.style.cursor = '';
});
svg.addEventListener('touchstart', function(e) {
  if (e.touches.length !== 1) return;
  panning = true;
  panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vx: vb.x, vy: vb.y };
}, { passive: true });
svg.addEventListener('touchmove', function(e) {
  if (!panning || e.touches.length !== 1) return;
  e.preventDefault();
  const s = panScale();
  vb.x = panStart.vx - (e.touches[0].clientX - panStart.x) * s;
  vb.y = panStart.vy - (e.touches[0].clientY - panStart.y) * s;
  setViewBox();
}, { passive: false });
svg.addEventListener('touchend', function() { panning = false; });

/* ---------- toggle restaurants ---------- */
document.getElementById('toggleEat').addEventListener('click', function() {
  hideEat = !hideEat;
  this.classList.toggle('active', hideEat);
  this.textContent = hideEat ? 'Show restaurants' : 'Hide restaurants';
  const day = days().find(d => +document.querySelector('.tab.active').dataset.id === d.id);
  drawAllDays();
  drawSelected(day);
  renderTimeline(day);
  drawBackupBranches();
  if (realMap && document.getElementById('realMap').style.display !== 'none') drawRealMap(day);
  const parts = (hideEat ? day.stops.filter(s => s.objective !== 'Eat') : day.stops).map(s => s.short);
  document.getElementById('summary').innerHTML =
    '<span class="slabel">'+day.label+' ROUTE</span> ' +
    parts.join(' <span class="arrow">→</span> ');
});

document.getElementById('tripBadge').textContent = DATA.trip.badge;
document.getElementById('tripTitle').textContent = DATA.trip.title;
document.getElementById('tripSub').textContent = DATA.trip.subtitle;
buildBase();
initLayers();
buildHotel();

selectDay(1);
